# =============================================================================
# SerOps — Self-Hosted Quick Start
# =============================================================================
# The full official SerOps stack — frontend, backend, Postgres, Redis,
# and a Caddy reverse proxy — on a single Docker host.
#
# SerOps is the AI layer that sits ON TOP of the observability stack you
# already run (see https://serops.ai/docs/integrations/overview/). Those
# tools are NOT bundled here — you connect SerOps to them from the
# Settings → Global Integrations page.
#
# Usage:
#   cp .env.example .env
#   # Edit .env — set POSTGRES_PASSWORD, REDIS_PASSWORD, DJANGO_SECRET_KEY, SEROPS_ENCRYPTION_KEY
#   # (AI provider keys are added in the UI, not here)
#   docker compose up -d          # the backend applies migrations on start
#   docker compose exec backend python manage.py createsuperuser
#   # or, for an org populated with example data to explore the product:
#   docker compose exec backend python manage.py seed_demo_org
#
# Only ports 80/443 are exposed to the host. Postgres and Redis are
# reachable only from inside the `serops` network.
# =============================================================================

services:

  postgres:
    image: postgres:16.15-alpine
    container_name: serops-postgres
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serops}
      POSTGRES_USER: ${POSTGRES_USER:-serops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      # No slow-statement log: it writes statements with their literal
      # parameters (emails, tokens) into the Postgres log. pg_stat_statements
      # gives the same visibility with normalised queries.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serops} -d ${POSTGRES_DB:-serops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - serops

  redis:
    image: redis:7.4.12-alpine
    container_name: serops-redis
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # The image's own redis user. Running it directly (instead of letting the
    # entrypoint drop privileges) lets the shell below read the password from
    # the environment, so it is not part of the process arguments.
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" PING | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serops

  backend:
    # Version wiring (Batch 43, SemVer discipline):
    #   * ``SEROPS_VERSION`` sets the tag (default 1.3.1). Matches
    #     what deployment/upgrading.md tells users. Rollback path is
    #     just: edit .env → change SEROPS_VERSION → up -d.
    #   * ``SEROPS_BACKEND_IMAGE`` overrides the WHOLE ref (registry
    #     + repo + tag) for operators pulling from a private mirror
    #     or air-gapped registry.
    #   * Never ``:latest`` for production — a rolling latest tag
    #     defeats the point of pinning versions for rollbackability.
    image: ${SEROPS_BACKEND_IMAGE:-ghcr.io/getserops/backend:${SEROPS_VERSION:-1.3.1}}
    # Build fallback so a fresh source clone works without published
    # images. Use ``docker compose up -d --build`` to force
    # a local build; otherwise the image ref above is used if present.
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: serops-backend
    restart: unless-stopped
    # The image runs as uid 10001 and needs no capability.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: bash start.sh
    env_file:
      - .env
    environment:
      # Wire the services together with the compose network hostnames.
      # These override whatever .env has for DB_HOST / REDIS_URL so a
      # self-hoster running outside compose can reuse the same .env.
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Caddy always serves HTTPS (Let's Encrypt, or its own certificate
      # for localhost): Secure cookies and HSTS.
      SEROPS_HTTPS: "True"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_media:/app/images
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - serops

  frontend:
    # Same version wiring pattern as backend — SEROPS_VERSION drives
    # the tag for both so they stay coordinated. Operators wanting
    # divergent FE/BE versions can override each ``_IMAGE`` var.
    image: ${SEROPS_FRONTEND_IMAGE:-ghcr.io/getserops/frontend:${SEROPS_VERSION:-1.3.1}}
    # Build fallback — see backend build block above for rationale.
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-/api}
    container_name: serops-frontend
    restart: unless-stopped
    # nginx-unprivileged on port 3000: no capability needed either.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      - backend
    networks:
      - serops

  # Reverse proxy — single ingress on host ports 80/443.
  # Caddy handles HTTPS automatically via Let's Encrypt when SEROPS_DOMAIN
  # is a real, publicly-reachable hostname. If you already run nginx /
  # Traefik / a cloud load balancer, remove this service and point your
  # own ingress at the `frontend` service on port 3000 (and `backend`
  # on port 8000 for /api/* routes — see config/caddy/Caddyfile for the
  # exact routing rules).
  caddy:
    image: caddy:2.11.9-alpine
    container_name: serops-caddy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SEROPS_DOMAIN: ${SEROPS_DOMAIN:-localhost}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - serops

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  backend_media:
  caddy_data:
  caddy_config:

networks:
  serops:
    name: serops
