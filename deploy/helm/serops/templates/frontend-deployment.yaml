{{- $comp := "frontend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serops.fullname" . }}-frontend
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      volumes:
        # nginx writes its pid and temp files under /tmp; the rest is read-only.
        - name: tmp
          emptyDir: {}
      containers:
        - name: frontend
          image: {{ include "serops.image" (dict "repository" .Values.frontend.image.repository "tag" .Values.frontend.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            # nginx in the frontend image listens on 3000 (see the frontend
            # Dockerfile: EXPOSE 3000). This declared 80, as did the Service's
            # targetPort below, so traffic was routed to a port nothing was
            # listening on: the frontend was unreachable through its own
            # Service and any Ingress in front of it returned 502. Reaching it
            # at all required port-forwarding straight to the pod.
            - containerPort: 3000
              name: http
          # No VITE_BASE_URL env var.
          #
          # It used to be set here, which could never work: Vite inlines
          # VITE_* variables into the bundle at BUILD time, and the frontend
          # Dockerfile writes it to .env before `npm run build`. Setting it on
          # a running container changes nothing at all, so a chart user who
          # edited `frontend.apiBaseUrl` got a silently unchanged bundle still
          # pointing at whatever the image was built with.
          #
          # The API URL is therefore a build-time decision:
          #   docker build --build-arg VITE_BASE_URL=https://your.host/api .
          # The image default is the RELATIVE path `/api`, which is what the
          # Ingress template below expects — route /api to the backend Service
          # and the browser reaches it on the same origin with no rebuild.
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "serops.fullname" . }}-frontend
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      name: http
  selector:
    {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 4 }}
