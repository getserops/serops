{{/*
  Combined Secret — carries values that were passed inline (dev / lab).
  Production installs set `existingSecret` on each block and this
  chart-managed Secret stays empty for that key.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "serops.fullname" . }}-secrets
  labels:
    {{- include "serops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.django.existingSecret }}
  django-secret-key: {{ required "django.secretKey is required (or set django.existingSecret)" .Values.django.secretKey | quote }}
  {{- end }}
  {{- /* Resolved through the helpers so that enabling devServices supplies
         the URL too. Previously these keys were written only from
         .Values.database.url / .Values.broker.url, so a lab install that
         switched on the bundled database got a Postgres pod and a backend
         that could not start — the deployment mounts database-url with
         optional: false and the key did not exist. */}}
  {{- $dbUrl := include "serops.databaseUrl" . }}
  {{- if and (not .Values.database.existingSecret) $dbUrl }}
  database-url: {{ $dbUrl | quote }}
  {{- end }}
  {{- $brokerUrl := include "serops.brokerUrl" . }}
  {{- if and (not .Values.broker.existingSecret) $brokerUrl }}
  broker-url: {{ $brokerUrl | quote }}
  {{- end }}
  {{- if not .Values.ai.embeddings.existingSecret }}
  {{- with .Values.ai.embeddings.openaiApiKey }}
  openai-api-key: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.alertSecrets.existingSecret }}
  {{- /* Same key names as an existingSecret: the backend reads these.
         They were alert-<source>, which nothing read, so inline secrets
         never reached the backend. */}}
  {{- with .Values.alertSecrets.alertmanager }}
  alertmanager: {{ . | quote }}
  {{- end }}
  {{- with .Values.alertSecrets.grafana }}
  grafana: {{ . | quote }}
  {{- end }}
  {{- with .Values.alertSecrets.datadog }}
  datadog: {{ . | quote }}
  {{- end }}
  {{- with .Values.alertSecrets.sentry }}
  sentry: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.smtp.existingSecret }}
  {{- with .Values.smtp.password }}
  smtp-password: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.selfMetrics.basicAuth }}
  metrics-basic-auth: {{ . | quote }}
  {{- end }}
