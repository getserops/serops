{{- $comp := "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serops.fullname" . }}-backend
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 8 }}
      annotations:
        # Roll the pods when the chart's env changes: they read it only at
        # start, so a settings-only upgrade otherwise kept the old values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # SerOps never calls the Kubernetes API: no token in the pod.
      automountServiceAccountToken: false
      serviceAccountName: {{ include "serops.serviceAccountName" . }}
      {{- include "serops.backendPodSecurity" . | nindent 6 }}
      containers:
        - name: backend
          image: {{ include "serops.image" (dict "repository" .Values.backend.image.repository "tag" .Values.backend.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- include "serops.backendContainerSecurity" . | nindent 10 }}
          # gunicorn with 4 workers per pod — DB conn count = replicas × 4.
          command: ["gunicorn", "api.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "60"]
          ports:
            - containerPort: 8000
              name: http
          {{- /* One envFrom only. There used to be a second block further
                 down rendering .Values.backend.envFrom, which is a duplicate
                 YAML key — the later one wins, so setting backend.envFrom
                 silently dropped the chart's own ConfigMap and with it
                 ALLOWED_HOSTS and DEBUG. Extra sources are appended here
                 instead. */}}
          envFrom:
            - configMapRef:
                name: {{ include "serops.fullname" . }}-config
            {{- with .Values.backend.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: django-secret-key
            - name: SEROPS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: encryption-key
            - name: SEROPS_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: encryption-key-previous
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: database-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: broker-url
            {{- if or .Values.smtp.existingSecret .Values.smtp.password }}
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: smtp-password
                  optional: true
            {{- end }}
            {{- if or .Values.alertSecrets.existingSecret .Values.alertSecrets.alertmanager .Values.alertSecrets.grafana .Values.alertSecrets.datadog .Values.alertSecrets.sentry }}
            - name: SEROPS_ALERTMANAGER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertSecrets.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: alertmanager
                  optional: true
            - name: SEROPS_GRAFANA_ALERT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertSecrets.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: grafana
                  optional: true
            - name: SEROPS_DATADOG_MONITOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertSecrets.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: datadog
                  optional: true
            - name: SEROPS_SENTRY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alertSecrets.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: sentry
                  optional: true
            {{- end }}
            {{- if .Values.selfMetrics.basicAuth }}
            - name: SEROPS_METRICS_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "serops.fullname" . }}-secrets
                  key: metrics-basic-auth
            {{- end }}
            {{- with .Values.backend.env }}
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.backend.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- include "serops.scheduling" (dict "root" $ "values" .Values.backend "component" "backend" "spread" true) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "serops.fullname" . }}-backend
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      name: http
  selector:
    {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 4 }}
