{{- if .Values.ingress.enabled -}}
{{- /* Without TLS the login form and Knox tokens travel in clear, and the
       backend derives SEROPS_HTTPS=False (no Secure cookies, no HSTS). A
       copy-paste install must not end up there by accident. */ -}}
{{- if and (not .Values.ingress.tls) (not .Values.ingress.allowInsecure) }}
{{- fail "ingress.tls is empty: SerOps would serve logins and API tokens over plain HTTP. Set ingress.tls (cert-manager annotation or an existing Secret), or set ingress.allowInsecure=true only when TLS terminates in front of the ingress controller and django.publicUrl is an https URL." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "serops.fullname" . }}
  labels:
    {{- include "serops.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ printf "%s-%s" (include "serops.fullname" $) .service }}
                port:
                  number: {{ if eq .service "backend" }}{{ $.Values.backend.service.port }}{{ else }}{{ $.Values.frontend.service.port }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
