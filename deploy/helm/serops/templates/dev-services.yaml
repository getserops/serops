{{/*
  Optional bundled Postgres / Redis for lab, demo and evaluation installs.

  Deliberately plain and pinned rather than a third-party subchart: the
  bitnami/postgresql and bitnami/redis dependencies this replaced pinned
  image tags that Bitnami withdrew from Docker Hub, so the chart's own
  "enable for lab installs" path could not pull an image at all.

  Storage is emptyDir. Restarting the pod loses the database. That is
  acceptable for evaluation and unacceptable for anything else, which is why
  these default to disabled and production points database.url / broker.url
  at real services.
*/}}
{{- if .Values.devServices.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serops.devPostgresHost" . }}
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "dev-postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "dev-postgres") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.devServices.postgresql.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.devServices.postgresql.image | quote }}
          {{- include "serops.devContainerSecurity" . | nindent 10 }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.devServices.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.devServices.postgresql.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.devServices.postgresql.database | quote }}
            # The default data directory is the mount point itself, which
            # Postgres refuses to initialise when it is non-empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.devServices.postgresql.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.devServices.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "serops.devPostgresHost" . }}
  labels:
    {{- include "serops.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "dev-postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: postgres
{{- end }}
{{- if .Values.devServices.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serops.devRedisHost" . }}
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "dev-redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "dev-redis") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.devServices.redis.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.devServices.redis.image | quote }}
          {{- include "serops.devContainerSecurity" . | nindent 10 }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.devServices.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "serops.devRedisHost" . }}
  labels:
    {{- include "serops.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "dev-redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: redis
{{- end }}
