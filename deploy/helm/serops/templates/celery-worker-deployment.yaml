{{- $comp := "celery-worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serops.fullname" . }}-celery-worker
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  replicas: {{ .Values.celeryWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 8 }}
      annotations:
        # Roll the pods when the chart's env changes: they read it only at
        # start, so a settings-only upgrade otherwise kept the old values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      # SerOps never calls the Kubernetes API: no token in the pod.
      automountServiceAccountToken: false
      serviceAccountName: {{ include "serops.serviceAccountName" . }}
      {{- include "serops.backendPodSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "serops.image" (dict "repository" .Values.celeryWorker.image.repository "tag" .Values.celeryWorker.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.celeryWorker.image.pullPolicy }}
          {{- include "serops.backendContainerSecurity" . | nindent 10 }}
          command:
            - celery
            - -A
            - api
            - worker
            - -Q
            - {{ include "serops.workerQueues" . | quote }}
            - --concurrency={{ .Values.celeryWorker.concurrency }}
            - --loglevel=INFO
          envFrom:
            - configMapRef:
                name: {{ include "serops.fullname" . }}-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: django-secret-key
            - name: SEROPS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: encryption-key
            - name: SEROPS_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: encryption-key-previous
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: database-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: broker-url
            {{- if or .Values.smtp.existingSecret .Values.smtp.password }}
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: smtp-password
                  optional: true
            {{- end }}
          {{- with .Values.celeryWorker.livenessProbe }}
          {{- if .enabled }}
          # A worker that is up but consumes nothing (seen on a fresh
          # install: 14 minutes idle, no error) fails the ping and is
          # restarted. $HOSTNAME is the worker's node name.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A api inspect ping -d celery@$HOSTNAME --timeout {{ .timeoutSeconds }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ add .timeoutSeconds 20 }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
      {{- include "serops.scheduling" (dict "root" $ "values" .Values.celeryWorker "component" "celery-worker" "spread" true) | nindent 6 }}
