{{- $comp := "celery-beat" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serops.fullname" . }}-celery-beat
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  # Beat is a scheduler — MUST be a single replica or scheduled tasks
  # will double-fire. If you need HA, use celery-beat with a Redis lock
  # (out of scope for MVP chart).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 8 }}
      annotations:
        # Roll the pods when the chart's env changes: they read it only at
        # start, so a settings-only upgrade otherwise kept the old values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      containers:
        - name: beat
          image: {{ include "serops.image" (dict "repository" .Values.celeryBeat.image.repository "tag" .Values.celeryBeat.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.celeryBeat.image.pullPolicy }}
          command:
            - celery
            - -A
            - api
            - beat
            - --loglevel=INFO
          envFrom:
            - configMapRef:
                name: {{ include "serops.fullname" . }}-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: django-secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: database-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: broker-url
          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
