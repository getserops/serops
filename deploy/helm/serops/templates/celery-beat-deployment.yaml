{{- $comp := "celery-beat" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "serops.fullname" . }}-celery-beat
  labels:
    {{- include "serops.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  # Beat is a scheduler — MUST be a single replica or scheduled tasks
  # will double-fire. If you need HA, use celery-beat with a Redis lock
  # (out of scope for MVP chart).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "serops.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" $comp) | nindent 8 }}
      annotations:
        # Roll the pods when the chart's env changes: they read it only at
        # start, so a settings-only upgrade otherwise kept the old values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      # SerOps never calls the Kubernetes API: no token in the pod.
      automountServiceAccountToken: false
      serviceAccountName: {{ include "serops.serviceAccountName" . }}
      {{- include "serops.backendPodSecurity" . | nindent 6 }}
      containers:
        - name: beat
          {{- /* Follows backend.image unless set: a pinned backend tag used to leave beat on appVersion. */}}
          image: {{ include "serops.image" (dict "repository" (.Values.celeryBeat.image.repository | default .Values.backend.image.repository) "tag" (.Values.celeryBeat.image.tag | default .Values.backend.image.tag) "root" .) }}
          imagePullPolicy: {{ .Values.celeryBeat.image.pullPolicy }}
          {{- include "serops.backendContainerSecurity" . | nindent 10 }}
          command:
            - celery
            - -A
            - api
            - beat
            - --loglevel=INFO
            # The image's root filesystem is read-only: keep the schedule in /tmp.
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: {{ include "serops.fullname" . }}-config
            {{- with $.Values.backend.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: django-secret-key
            - name: SEROPS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: encryption-key
            - name: SEROPS_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: encryption-key-previous
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: database-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.broker.existingSecret | default (printf "%s-secrets" (include "serops.fullname" .)) }}
                  key: broker-url
            {{- /* backend.env reaches every pod that runs the backend image:
                   the API, the Celery workers and beat, and the migration
                   job. It used to reach the API pods only. */}}
            {{- range $k, $v := $.Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
      {{- include "serops.scheduling" (dict "root" $ "values" .Values.celeryBeat "component" "celery-beat" "spread" false) | nindent 6 }}
