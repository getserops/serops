{{/*
  One ServiceAccount per release, so SerOps pods do not run as the
  namespace's `default` account (whose RBAC and token policy the chart does
  not control). SerOps never calls the Kubernetes API, so no token is
  mounted: automountServiceAccountToken is false here and on every pod.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "serops.serviceAccountName" . }}
  labels:
    {{- include "serops.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
