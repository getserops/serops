# SerOps Helm chart values — v1.3.0
#
# All defaults are safe for a small production deployment (~5 users,
# 100 batches/day). Scale replicas + resources for larger tenants.
#
# Required overrides at minimum:
#   - image.repository (once we publish to ghcr.io/getserops/*)
#   - existingSecret with AI keys, or ai.provider.apiKey inline
#   - ingress.hosts[0].host = your domain

# ============================================================================
# Global
# ============================================================================
global:
  # Prefixed to all resource names when nameOverride is empty.
  nameOverride: ""
  fullnameOverride: ""

# ============================================================================
# Security context
# ============================================================================
# Every SerOps pod runs as a non-root user with no privilege escalation, no
# Linux capabilities, the runtime's default seccomp profile and a read-only
# root filesystem: the Kubernetes "restricted" Pod Security Standard. These
# apply to the backend, Celery and migration pods (the backend image's user
# is uid 10001); writable scratch space is an emptyDir at /tmp and /app/logs.
# The frontend has its own block below. Change the ids only if a cluster
# policy assigns them (OpenShift: remove runAsUser, runAsGroup and fsGroup).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ============================================================================
# Backend (Django + gunicorn)
# ============================================================================
backend:
  replicaCount: 2
  image:
    repository: ghcr.io/getserops/backend
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  # Environment variables — merged with configmap + secret below.
  env: {}
  # Add extra env vars from another ConfigMap / Secret (helm-common pattern).
  envFrom: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Liveness / readiness — hits the /api/health/ endpoint that already exists.
  # The kubelet connects by pod IP, which is never in ALLOWED_HOSTS, so the
  # probes name localhost instead (the chart always allows it).
  probes:
    liveness:
      httpGet:
        path: /api/health/
        port: 8000
        httpHeaders:
          - name: Host
            value: localhost
      initialDelaySeconds: 30
      periodSeconds: 15
    readiness:
      httpGet:
        path: /api/health/
        port: 8000
        httpHeaders:
          - name: Host
            value: localhost
      initialDelaySeconds: 10
      periodSeconds: 10
  # Pod-level extras.
  # Scheduling. Replicas are spread one per node by default (soft:
  # ScheduleAnyway, so a single node still runs them all); set
  # spreadAcrossNodes: false to turn that off, or give your own
  # topologySpreadConstraints.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  spreadAcrossNodes: true
  podAnnotations: {}

# ============================================================================
# Frontend (Vite build served by nginx)
# ============================================================================
frontend:
  replicaCount: 2
  # nginx's unprivileged image: uid 101, pid and temp files under /tmp.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  image:
    repository: ghcr.io/getserops/frontend
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  # The API base URL is NOT configurable here — it is baked into the bundle
  # when the image is built, because Vite inlines VITE_* variables at build
  # time. This key used to exist and was wired to a runtime env var, which
  # could not take effect; the comment claiming it was "rendered into a runtime
  # config file at container start" described behaviour that did not exist.
  #
  # Build the image with the URL you need:
  #   docker build --build-arg VITE_BASE_URL=https://your.host/api .
  # Or keep the image default, the relative path `/api`, and route /api to the
  # backend with the ingress below — then one image works for every host.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []   # default: soft one-per-node spread
  spreadAcrossNodes: true

# ============================================================================
# Celery worker — batch analysis, AI calls, webhooks
# ============================================================================

celeryWorker:
  replicaCount: 2
  image:
    # Same image as backend; different command.
    repository: ghcr.io/getserops/backend
    tag: ""
    pullPolicy: IfNotPresent
  # Queues this worker consumes. The chart always adds the four the backend
  # routes to (celery, high_priority, normal, background); list extra ones here.
  queues: "celery,high_priority,normal,background"
  concurrency: 4
  # Restart a worker that stops answering `celery inspect ping`.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []   # default: soft one-per-node spread
  spreadAcrossNodes: true

# ============================================================================
# Celery beat — scheduled batch trigger, retention cleanup
# ============================================================================

celeryBeat:
  # Only ever ONE beat pod — beat is a scheduler; multiple copies would
  # double-fire scheduled tasks.
  replicaCount: 1
  image:
    repository: ghcr.io/getserops/backend
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ============================================================================
# Ingress
# ============================================================================

ingress:
  enabled: true
  className: nginx
  annotations:
    # Uncomment for cert-manager auto TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    # Plain-HTTP requests are redirected to HTTPS once ingress.tls is set.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: serops.example.com
      paths:
        # Backend API paths.
        - path: /api
          pathType: Prefix
          service: backend
        # /metrics is not published: Prometheus scrapes it inside the
        # cluster (serviceMonitor.enabled). To scrape from outside, add
        # `- {path: /metrics, pathType: Prefix, service: backend}` and set
        # SEROPS_METRICS_BASIC_AUTH.
        # Everything else → frontend (Vite SPA).
        - path: /
          pathType: Prefix
          service: frontend
  # REQUIRED when ingress is enabled: the chart refuses to render without
  # it, because a plain-HTTP install sends logins and API tokens in clear and
  # the backend then runs without Secure cookies or HSTS. With cert-manager,
  # uncomment the annotation above and list the host here; otherwise point
  # secretName at a TLS Secret you manage.
  tls: []
    # - hosts:
    #     - serops.example.com
    #   secretName: serops-tls
  # Only when TLS terminates in front of the ingress controller (a cloud load
  # balancer, a service mesh). Then also set django.publicUrl to the https
  # URL, or the backend believes it is serving HTTP.
  allowInsecure: false

# ============================================================================
# Service account
# ============================================================================
# One ServiceAccount per release: the pods do not run as the namespace's
# `default` account. SerOps never calls the Kubernetes API, so no token is
# mounted on any pod.
serviceAccount:
  create: true
  name: ""          # defaults to the release's full name
  annotations: {}   # e.g. IRSA / Workload Identity, if the DB needs it

# ============================================================================
# Pod disruption budgets
# ============================================================================
# Keeps one backend, frontend and worker pod running through node drains.
# Rendered only for components with more than one replica (beat is always
# one). Set maxUnavailable instead of minAvailable if you prefer.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# ============================================================================
# Network policy
# ============================================================================
# On by default. Only the ingress controller reaches the frontend and the
# backend; nothing reaches the worker, beat or the migration job; the
# bundled dev Postgres/Redis accept connections from SerOps pods only.
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, most managed
# clusters); without one the objects are inert.
networkPolicy:
  enabled: true
  # Peers allowed to reach the frontend (3000) and the backend (8000): your
  # ingress controller. The default matches the ingress-nginx namespace; set
  # the namespace label and/or a podSelector of your controller.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  # Extra peers allowed to reach the backend on 8000, e.g. Prometheus for
  # /metrics when serviceMonitor.enabled:
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  backendExtraIngressFrom: []
  # Namespace of the cluster DNS (always allowed on 53/udp+tcp).
  dnsNamespace: kube-system
  # Where backend, worker, beat and the migration job may connect. Empty:
  # anywhere. SerOps queries the observability providers, SCM and AI
  # endpoints you configure, on whatever hosts and ports they use, so the
  # chart cannot guess a tighter default. Narrow it to your database, Redis,
  # providers and AI endpoints, for example:
  #   - to: [{ipBlock: {cidr: 10.0.0.0/8}}]
  #   - to: [{ipBlock: {cidr: 0.0.0.0/0, except: [10.0.0.0/8]}}]
  #     ports: [{port: 443, protocol: TCP}]
  # DNS and the bundled dev services are always allowed in addition.
  egress: []

# ============================================================================
# Database — Postgres 16
# ============================================================================
# Production: bring your own Postgres (AWS RDS, GCP Cloud SQL, self-hosted)
# and set database.url below. For a lab or demo install, switch on
# devServices.postgresql further down.
database:
  # Used when devServices.postgresql.enabled=false. Format:
  # postgres://user:pass@host:5432/serops
  url: ""
  existingSecret: ""   # secret key = database-url

# ============================================================================
# Redis / broker
# ============================================================================
broker:
  url: ""   # external Redis URL: redis://:pass@host:6379/0
  existingSecret: ""   # secret key = broker-url

# ============================================================================
# Database migrations
# ============================================================================
# Runs `manage.py migrate` as a Helm post-install/post-upgrade hook. Before
# this existed the chart brought up a backend against an empty database and
# every request failed on missing tables, with nothing saying a manual step
# had been skipped.
#
# Disable only if you run migrations yourself (for example a separate
# pipeline stage that gates on a review of the SQL).
migrations:
  enabled: true
  backoffLimit: 2
  # An init container polls the database until it accepts connections,
  # so a cold Postgres does not burn a Job attempt on 'connection
  # refused'. Raise for slow-starting managed databases.
  waitForDatabaseSeconds: 120
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

# ============================================================================
# Bundled dev services — lab / demo / evaluation ONLY
# ============================================================================
# Replaces the bitnami/postgresql + bitnami/redis subcharts this chart used
# to depend on. Those pinned image tags no longer exist on Docker Hub
# (Bitnami moved versioned tags behind bitnamisecure in 2025), so the
# subcharts could not start at all, and following them forward would mean an
# UNPINNED `latest` Postgres — where an unannounced major bump breaks data
# compatibility on the next restart.
#
# These are plain pinned Deployments instead. Enabling either one also
# rewrites the matching connection URL, so the app is actually wired to it.
#
# NOT FOR PRODUCTION: storage is emptyDir, so all data is lost when the pod
# restarts, and the credentials below sit in values.
devServices:
  postgresql:
    enabled: false
    image: postgres:16.15-alpine
    # The Alpine postgres image's own user (uid 70).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      fsGroup: 70
      seccompProfile:
        type: RuntimeDefault
    user: serops
    # Empty: a random password is generated at install and kept across
    # upgrades (read back from the release's Secret). Set one only if you
    # need to know it; it then sits in your values file.
    password: ""
    database: serops
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 1Gi}
  redis:
    enabled: false
    image: redis:7.4.12-alpine
    # Same as postgresql.password: empty means generated and kept. Redis
    # requires it (requirepass), so a stray pod on the namespace cannot read
    # the queue.
    password: ""
    # The redis image's own user (uid 999).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

# ============================================================================
# AI providers
# ============================================================================
# RCA provider keys (Anthropic / Google / DeepSeek / OpenAI) are NOT
# configured here. SerOps reads them per-organisation from the database,
# never from the environment — a shared cluster-wide key would pool quota
# and billing across every org on the instance.
#
# Add them after install at:  Settings -> AI -> API Keys
#
# Similar-incident embeddings use the same per-organisation provider
# (OpenAI, Gemini or Ollama) and a local lexical fallback otherwise. The
# former ai.embeddings.* values (an OPENAI_API_KEY env var) were removed:
# nothing reads them any more.

# ============================================================================
# SMTP (env-only — mirrors backend/api/settings.py policy)
# ============================================================================
smtp:
  existingSecret: ""   # keys: smtp-user, smtp-password, smtp-host, smtp-port
  host: ""
  port: 587
  # How the connection is secured: "starttls" (port 587, the default),
  # "ssl" (implicit TLS, port 465) or "none" (plain SMTP: a local relay or a
  # test catcher such as Mailpit). Without it the chart always sent
  # EMAIL_USE_TLS=True, so a port-465 or plain relay could not be used.
  security: starttls
  user: ""
  password: ""
  fromEmail: "noreply@example.com"

# ============================================================================
# Alert webhook secrets (Item #13)
# ============================================================================
alertSecrets:
  # Same env-only pattern. Empty = source rejects all webhooks.
  existingSecret: ""   # keys: alertmanager, grafana, datadog, sentry
  alertmanager: ""
  grafana: ""
  datadog: ""
  # The client secret of your Sentry internal integration (Sentry signs
  # its webhooks with it). See docs: Integrations → Real-time Alerts.
  sentry: ""

# ============================================================================
# Self-metrics
# ============================================================================
selfMetrics:
  # Optional basic-auth for the /metrics endpoint. Leave empty for open
  # scrape (safe on private network). Format: "user:pass".
  basicAuth: ""

# ============================================================================
# Django
# ============================================================================
django:
  secretKey: ""            # REQUIRED — generate with `openssl rand -hex 64`
  # REQUIRED. Encrypts the credentials stored in the database. Generate with
  # `openssl rand -base64 32 | tr '+/' '-_'` and back it up: without it they
  # cannot be read.
  encryptionKey: ""
  encryptionKeyPrevious: "" # While changing the key: the old one(s), comma-separated
  # Metric collection. The application default is FALSE (see METRICS_ENABLED
  # in Data/tasks.py), which is wrong for a Kubernetes install: metrics are
  # half of what the AI reasons over, and the chart never set this, so
  # Helm-deployed instances silently ran log-only.
  metricsEnabled: true
  existingSecret: ""       # keys = django-secret-key, encryption-key, optional encryption-key-previous
  debug: false
  allowedHosts: "serops.example.com"
  # Origins the browser loads the frontend from, comma-separated, scheme and
  # port included (e.g. "https://serops.example.com" or
  # "http://localhost:8080,http://localhost:3000"). Without this the API
  # rejects the frontend's own requests and the login page reads as though the
  # password were wrong.
  corsAllowedOrigins: "https://serops.example.com"
  # The URL users open SerOps at, e.g. "https://serops.example.com". Used for
  # the SSO redirect URI and links in emails. Empty: the first ingress host,
  # https when ingress.tls is set.
  publicUrl: ""

# ============================================================================
# ServiceMonitor — for the Prometheus Operator
# ============================================================================
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
