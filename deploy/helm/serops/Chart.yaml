apiVersion: v2
name: serops
description: |
  SerOps — AGPL-3.0 AI Root Cause Analysis platform. Deploys the
  Django backend, React frontend, Celery worker, Celery beat, plus
  optional bundled PostgreSQL + Redis.
type: application
# Chart version — bumped per chart change independent of the app.
version: 0.1.0
# App version — mirrors the SerOps release cut.
appVersion: "1.0.0"
kubeVersion: ">= 1.25.0"
keywords:
  - observability
  - sre
  - incident-response
  - ai
  - rca
  - devops
home: https://github.com/getserops
sources:
  - https://github.com/getserops/serops
maintainers:
  - name: SerOps contributors
    url: https://github.com/getserops
# No subchart dependencies.
#
# This chart previously bundled bitnami/postgresql 15.5.28 and
# bitnami/redis 20.6.3 for lab installs. Both were removed because the
# image tags they pin no longer exist on Docker Hub — Bitnami moved
# versioned tags behind bitnamisecure in 2025, leaving only `latest` free.
# Pulling them fails outright ("bitnami/postgresql:16.4.0-debian-12-r7: not
# found"), and following the charts forward would mean running an UNPINNED
# `latest` Postgres, where an unannounced major-version bump breaks data
# compatibility on restart.
#
# Lab and demo installs are served by `devServices` in values.yaml instead:
# plain pinned postgres/redis Deployments, no third-party chart, no
# registry that can withdraw a tag. Production installs continue to point
# `database.url` and `broker.url` at services you already run.
