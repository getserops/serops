# =============================================================================
# SerOps: local demo
# =============================================================================
# One command, from the repository root:
#
#   deploy/demo/demo.sh
#
# It writes random secrets to deploy/demo/.env (first run only), starts this
# stack, loads the "Acme Cloud" example organisation and prints the address:
# http://localhost:8080, "Try the live demo". No AI key is needed: the example
# analyses are part of the seed and the demo user is read-only.
#
# This is a demo, not an install: plain HTTP, bound to 127.0.0.1 only, demo
# sign-in only. To run SerOps on your own data use deploy/quick-start.
# Stop and delete everything: deploy/demo/demo.sh down
# =============================================================================

name: serops-demo

x-backend-env: &backend-env
  DEBUG: "False"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?run deploy/demo/demo.sh, it writes .env}
  SEROPS_ENCRYPTION_KEY: ${SEROPS_ENCRYPTION_KEY:?run deploy/demo/demo.sh, it writes .env}
  ALLOWED_HOSTS: localhost,127.0.0.1,backend
  CORS_ALLOWED_ORIGINS: http://localhost:${SEROPS_DEMO_PORT:-8080}
  API_URL: http://localhost:${SEROPS_DEMO_PORT:-8080}/api
  REACT_URL: http://localhost:${SEROPS_DEMO_PORT:-8080}
  SERVER_URL: http://localhost:${SEROPS_DEMO_PORT:-8080}/api
  BASE_URL: http://localhost:${SEROPS_DEMO_PORT:-8080}
  DB_NAME: serops
  DB_USER: serops
  DB_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/demo/demo.sh, it writes .env}
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  # The login page shows only "Try the live demo"; nobody can register.
  DEMO_ONLY_LOGIN: "true"
  REGISTRATION_ENABLED: "false"
  # Plain HTTP on localhost: cookies must not be marked Secure.
  SEROPS_HTTPS: "False"

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: serops
      POSTGRES_USER: serops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/demo/demo.sh, it writes .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serops -d serops"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run deploy/demo/demo.sh, it writes .env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" PING | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${SEROPS_BACKEND_IMAGE:-ghcr.io/getserops/backend:${SEROPS_VERSION:-1.5.4}}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: bash start.sh
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  frontend:
    image: ${SEROPS_FRONTEND_IMAGE:-ghcr.io/getserops/frontend:${SEROPS_VERSION:-1.5.4}}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      - backend

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      # Localhost only: the demo is not meant to be reachable from the network.
      - "127.0.0.1:${SEROPS_DEMO_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
