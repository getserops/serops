site_name: SerOps Documentation
site_description: >-
  SerOps documentation: install, connect your logs, metrics, traces and
  CI/CD, and get AI root cause analysis on your own infrastructure.
site_url: https://serops.ai/docs/
repo_url: https://github.com/getserops/serops
repo_name: getserops/serops
docs_dir: src
copyright: >
  Copyright &copy; 2026 SerOps contributors —
  <a href="/docs/license/">AGPL-3.0</a> ·
  <a href="https://serops.ai/">serops.ai</a> ·
  <a href="https://serops.ai/compare">Compare</a> ·
  <a href="https://serops.ai/use-cases">Use cases</a>

theme:
  name: material
  # Title, social and breadcrumb tags for search (overrides/main.html).
  custom_dir: overrides
  # System fonts: Google Fonts was a render-blocking third-party request
  # (the first paragraph appeared after 14 s on mobile) and sends every
  # visitor's IP to Google.
  font: false
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# Pages deliberately kept out of the nav: they are redirect stubs left behind
# when a large page was split, so old external links keep resolving instead of
# 404ing. Declaring them here states the intent and keeps `--strict` quiet about
# them, which is what lets the link validation below be an error rather than a
# note nobody reads.
not_in_nav: |
  api-reference.md
  architecture.md
  admin/observability.md

# Link problems must fail the build, not scroll past in the log.
#
# mkdocs reports broken anchors and unresolvable relative links at INFO by
# default, so `mkdocs build --strict` happily succeeded while three were live:
# a link to `../backend` that means nothing inside the rendered site, and two
# anchors that were near-misses for their real headings
# (`#use-an-external-postgresql` for a section called "Use an external
# Postgres"). Raised to warnings so --strict turns them into failures.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

