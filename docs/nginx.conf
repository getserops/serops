server {
    listen 80;
    # Accept any Host header — Caddy is the routing layer and
    # forwards traffic here regardless of vhost (docs.serops.ai
    # today, serops.ai/docs after the migration).
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Cache static assets aggressively — mkdocs Material fingerprints
    # every filename with a content hash, so year-long immutable is safe.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Caddy serves this site at serops.ai/docs/ and strips the /docs prefix
    # before proxying. nginx's built-in trailing-slash redirect therefore
    # sent /docs/foo to http://serops.ai/foo/ — outside /docs and downgraded
    # to HTTP — so any link without the trailing slash landed on another
    # site. Redirect directories ourselves, relative and with the prefix.
    absolute_redirect off;

    # Static site routing — file, then directory index, else the mkdocs 404
    # page. (Falling back to /index.html served the home page with a 200 for
    # every typo, with its relative asset paths broken.)
    location / {
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ /docs$1/ permanent;
        }
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Health check endpoint used by the container HEALTHCHECK.
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
