# Cache policy per file. Material fingerprints its own bundles
# (main.<hash>.min.css, bundle.<hash>.min.js); custom.css, images and the
# search index keep fixed names, so they must not be cached as immutable.
map $uri $docs_cache_control {
    "~*\.[0-9a-f]{8}\.min\.(css|js)$" "public, max-age=31536000, immutable";
    ~*\.(woff2?|ttf)$                   "public, max-age=31536000, immutable";
    ~*\.(png|jpe?g|gif|ico|svg|webp)$   "public, max-age=86400";
    default                              "public, max-age=300";
}

# Section folders (/docs/user-guide/ ...) have no index page of their own, so
# nginx answered 403 and Search Console reported redirect errors for the old
# docs.serops.ai links that land on them. Send each to its first nav page,
# with or without the trailing slash, in one hop. Keep in step with the nav
# in mkdocs.yml.
map $uri $docs_section_home {
    ~^/getting-started/?$ /docs/getting-started/quick-start-self-hosted/;
    ~^/deployment/?$      /docs/deployment/requirements/;
    ~^/user-guide/?$      /docs/user-guide/dashboard/;
    ~^/how-to/?$          /docs/how-to/connect-provider/;
    ~^/integrations/?$    /docs/integrations/overview/;
    ~^/admin/?$           /docs/admin/settings/;
    ~^/security/?$        /docs/security/authentication/;
    ~^/architecture/?$    /docs/architecture/overview/;
    ~^/development/?$     /docs/development/testing/;
    ~^/api/?$             /docs/api/overview/;
    default               "";
}

server {
    listen 80;
    # Accept any Host header — Caddy is the routing layer and
    # forwards traffic here regardless of vhost (docs.serops.ai
    # today, serops.ai/docs after the migration).
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression. gzip_proxied matters: Caddy forwards every request
    # with a Via header, and nginx's default (off) then compressed nothing —
    # the 680 KB search index and every page went out uncompressed.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1000;

    # Caching (see the map above): fingerprinted Material bundles for a year,
    # everything else — pages, search index, custom.css — briefly, so a
    # deploy shows up within minutes. One Cache-Control header, not two.
    add_header Cache-Control $docs_cache_control always;

    # Caddy serves this site at serops.ai/docs/ and strips the /docs prefix
    # before proxying. nginx's built-in trailing-slash redirect therefore
    # sent /docs/foo to http://serops.ai/foo/ — outside /docs and downgraded
    # to HTTP — so any link without the trailing slash landed on another
    # site. Redirect directories ourselves, relative and with the prefix.
    absolute_redirect off;

    if ($docs_section_home) {
        return 301 $docs_section_home;
    }

    # Static site routing — file, then directory index, else the mkdocs 404
    # page. (Falling back to /index.html served the home page with a 200 for
    # every typo, with its relative asset paths broken.)
    location / {
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ /docs$1/ permanent;
        }
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Health check endpoint used by the container HEALTHCHECK.
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
