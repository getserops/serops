server {
    listen 80;
    # Accept any Host header — Caddy is the routing layer and
    # forwards traffic here regardless of vhost (docs.serops.ai
    # today, serops.ai/docs after the migration).
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Cache static assets aggressively — mkdocs Material fingerprints
    # every filename with a content hash, so year-long immutable is safe.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static site routing — try file, then directory, then 404.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Health check endpoint used by the container HEALTHCHECK.
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
