# Security headers for every response. nginx drops server-level add_header
# directives in any location that sets its own, so each location includes
# this file instead of relying on inheritance.
add_header X-Frame-Options "DENY" always;
# Script only from this origin: the login token lives in localStorage, so an
# injected script would be an account takeover. Styles allow inline (MUI and
# emotion inject <style>); images allow data: (logos, avatars) and https:;
# the API may be on another https origin (VITE_BASE_URL).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
