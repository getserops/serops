# Ruff — what CI fails the build on.
#
# There was no config, so CI ran whatever an unpinned `pip install ruff`
# defaulted to. Ruff 0.17 widened its defaults to pyupgrade, pylint, bugbear,
# datetime and dozens more families: 3133 findings, nearly all style, and the
# job never passed — which also meant the test suite after it never ran.
#
# The selection is the correctness core (the same set GitHub's starter Python
# workflow fails on): code that cannot run as written.
#   E9   syntax / IO errors
#   F63  invalid comparisons (`is` against a literal, etc.)
#   F7   statements in the wrong place (`return` outside a function, ...)
#   F82  undefined names — the NameError class. This found two real ones on
#        day one: an unbound interval in Data.tasks.create_log_batch, and the
#        cross-organisation check in the SCM/CI-CD binding endpoints raising
#        NameError (a 500) instead of a 400.
#
# Style rules (unused imports, unused variables, import order, pyupgrade) are a
# separate clean-up. Not a blind `ruff --fix`: in Django, some "unused" imports
# register signals and admin classes. Widen this list one family at a time,
# fixing as you go.

target-version = "py311"

[lint]
select = ["E9", "F63", "F7", "F82"]
