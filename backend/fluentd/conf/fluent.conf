<system>
  log_level info
</system>

# ============================================================================
# APPLICATION LOGS
# ============================================================================

# Backend logs
<source>
  @type tail
  read_from_head true
  path /logs/aaw/app/django.log, /logs/aaw/app/user_actions.log
  pos_file /var/log/td-agent/positions/backend.pos
  tag aaw.backend
  <parse>
    @type regexp
    expression /^\[(?<timestamp>[^\]]+)\] (?<levelname>\w+): (?<message>.*)$/
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
</source>

# Enrich logs with project and service metadata
<filter aaw.backend>
  @type record_transformer
  <record>
    project_name aaw
    service_name backend
  </record>
</filter>

# Frontend logs
<source>
  @type tail
  read_from_head true
  path /logs/aaw/app/frontend.log
  pos_file /var/log/td-agent/positions/frontend.pos
  tag aaw.frontend
  <parse>
    @type regexp
    expression /^\[(?<timestamp>[^\]]+)\] (?<levelname>\w+): (?<message>.*)$/
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
</source>

# Enrich logs with project and service metadata
<filter aaw.frontend>
  @type record_transformer
  <record>
    project_name aaw
    service_name frontend
  </record>
</filter>

# Source for sys logs
<source>
  @type tail
  read_from_head true
  path /var/log/syslog
  pos_file /var/log/td-agent/positions/syslog.pos
  tag aaw.syslog
  <parse>
    @type syslog
  </parse>
</source>

# Enrich logs with project and service metadata
<filter aaw.syslog>
  @type record_transformer
  <record>
    project_name aaw
    service_name syslog
    levelname ${record["severity"] || "INFO"}
  </record>
</filter>

<match aaw.*>
  @type elasticsearch
  host 5.161.252.26
  port 9200
  user elastic
  password aGVsbG9lc2Zyb210bg
  index_name application-logs-aaw
  include_timestamp true
  request_timeout 30s
  reload_connections false
  reload_on_failure false
  logstash_format false

  <buffer tag>
    @type file
    path /fluentd/buffer/app_logs
    flush_mode interval
    flush_interval 15s
    chunk_limit_size 8m
    queue_limit_length 32
    retry_max_times 5
    retry_wait 2s
    retry_exponential_backoff_base 2
    retry_max_interval 30s
    overflow_action block
  </buffer>
  
  <secondary>
    @type file
    path /fluentd/failed/app_logs
  </secondary>
</match>