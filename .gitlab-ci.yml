# GitLab CI — the maintainers' internal mirror of the checks.
#
# The public repository is on GitHub, where .github/workflows/ runs the same
# four checks (plus image and chart publishing) on every push and pull
# request. GitLab does not read .github/workflows, hence this file. The two are
# deliberate duplicates: if you change one, change both.
#
# Jobs are path-scoped: a docs typo does not boot Postgres.

stages: [test]

default:
  interruptible: true

# ---------------------------------------------------------------------------
# Backend — Django + Celery
# ---------------------------------------------------------------------------
backend:
  stage: test
  image: python:3.12
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: test_serops
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: testpass
    DJANGO_SETTINGS_MODULE: api.test_settings
    DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
    DEBUG: 'True'
    TEST_DB_HOST: postgres
    TEST_DB_PORT: '5432'
    TEST_DB_NAME: test_serops
    TEST_DB_USER: postgres
    TEST_DB_PASSWORD: testpass
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    # Registration and team-invite flows build activation links from these,
    # and the tests assert the link was sent. Locally they come from a .env
    # that is gitignored, so without them four tests fail on a clean checkout
    # for reasons that look nothing like the cause.
    API_URL: http://localhost:8000
    REACT_URL: http://localhost:3000
    SERVER_URL: http://localhost:8000
  cache:
    key:
      files: [backend/requirements.txt]
    paths: [.pip-cache]
  before_script:
    - export PIP_CACHE_DIR="$CI_PROJECT_DIR/.pip-cache"
    - apt-get update -qq && apt-get install -y -qq libpq-dev
    - cd backend
    # Pinned: ruff's defaults change between releases, and an unpinned install
    # let 0.17 redefine what passes. Rules live in backend/ruff.toml.
    - pip install --quiet -r requirements.txt ruff==0.17.0
  script:
    - ruff check .
    - python manage.py makemigrations --check --dry-run
    # The whole suite, not a named subset. A hand-maintained module list goes
    # stale the moment an app is added, and one such list kept 402 tests hidden
    # behind an empty tests.py stub for months.
    - python manage.py test --verbosity=1 --noinput
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [backend/**/*]

# ---------------------------------------------------------------------------
# Frontend — React + Vite
# ---------------------------------------------------------------------------
frontend:
  stage: test
  image: node:20
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules]
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --fund=false
  script:
    - npm run lint
    - npm test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [frontend/**/*]

# ---------------------------------------------------------------------------
# UI quality — axe (light + dark), phone layout, table alignment on every
# main page, against the quick-start stack built from this commit.
# ---------------------------------------------------------------------------
ui-quality:
  stage: test
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    SEROPS_BACKEND_IMAGE: serops-ci/backend
    SEROPS_FRONTEND_IMAGE: serops-ci/frontend
  script:
    - apk add --no-cache openssl
    - docker build -t "$SEROPS_BACKEND_IMAGE" backend
    - docker build -t "$SEROPS_FRONTEND_IMAGE" --build-arg VITE_BASE_URL=/api frontend
    - cd deploy/quick-start
    - cp .env.example .env
    - sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -hex 32)|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|; s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$(openssl rand -hex 16)|" .env
    - docker compose up -d --no-build --wait
    - docker compose exec -T backend python manage.py seed_demo_org
    - cd ../..
    # Caddy publishes 443 on the dind host, so the browser runs there too.
    # Bind mounts don't reach the dind daemon: copy the sources in instead.
    - >
      CID=$(docker create --network host -w /app -e CI=1 -e UI_BASE_URL=https://localhost
      mcr.microsoft.com/playwright:v1.63.0-jammy
      sh -c "npm ci --no-audit --fund=false && npx playwright test -c playwright.ui-quality.config.ts")
    - docker cp frontend/. "$CID":/app
    - STATUS=0; docker start -a "$CID" || STATUS=$?
    - docker cp "$CID":/app/playwright-report-ui frontend/ || true
    - exit $STATUS
  artifacts:
    when: always
    expire_in: 14 days
    paths: [frontend/playwright-report-ui]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*, backend/**/*, deploy/quick-start/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [frontend/**/*, backend/**/*, deploy/quick-start/**/*]

# ---------------------------------------------------------------------------
# Docs — MkDocs
# ---------------------------------------------------------------------------
docs:
  stage: test
  image: python:3.12-alpine
  before_script:
    - cd docs
    # The same two packages docs/Dockerfile installs, so CI and the published
    # image build the site identically.
    - pip install --quiet --no-cache-dir mkdocs-material pymdown-extensions
  script:
    # --strict turns warnings into failures, and mkdocs.yml raises broken
    # anchors and unresolvable links to warnings. Three were live in the
    # published docs before anything checked.
    - mkdocs build --strict
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [docs/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [docs/**/*]

# ---------------------------------------------------------------------------
# Helm chart
# ---------------------------------------------------------------------------
chart:
  stage: test
  image:
    name: alpine/helm:3.16.2
    entrypoint: ['']
  script:
    - helm lint deploy/helm/serops
    # Proves the chart renders. secretKey is required, so a throwaway value is
    # supplied rather than making the template tolerate its absence.
    - helm template serops deploy/helm/serops
      --kube-version 1.31.0
      --set django.secretKey=ci-render-only
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [deploy/helm/**/*]
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [deploy/helm/**/*]
