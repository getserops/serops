name: CI

# NOT the pipeline that runs today. SerOps is developed on GitLab, which does
# not read .github/workflows — see .gitlab-ci.yml for the live equivalent. This
# file is kept ready for a GitHub publish; the two are deliberate duplicates of
# the same checks, so a change to one belongs in the other.
#

# Monorepo CI. The per-repo workflows this replaces lived in the backend and
# frontend polyrepos, which are being retired — without this, pushing the
# monorepo to GitHub would ship a repository that tests nothing.
#
# Paths are scoped so a frontend-only change does not spend 10 minutes booting
# Postgres, and vice versa.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_serops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: api.test_settings
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: 'True'
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5432'
      TEST_DB_NAME: test_serops
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: testpass
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      # Registration and team-invite flows build activation links from these,
      # and the tests assert the link was sent. Locally they come from a .env
      # that is gitignored, so without them four tests fail on a clean checkout
      # for reasons that look nothing like the cause.
      API_URL: http://localhost:8000
      REACT_URL: http://localhost:3000
      SERVER_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install python dependencies
        run: pip install -r requirements.txt ruff==0.17.0  # pinned; rules in backend/ruff.toml
      - name: ruff check
        run: ruff check .
      - name: Migration check
        run: python manage.py makemigrations --check --dry-run
      - name: Run the whole test suite
        # The polyrepo workflow named seven modules explicitly, which quietly
        # excluded most of the suite — including, for a long time, 402 tests
        # that an empty tests.py stub was shadowing. A named list goes stale the
        # moment someone adds an app. Run everything.
        run: python manage.py test --verbosity=1 --noinput

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docs:
    name: Docs — strict build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs
        # Same two packages the docs Dockerfile installs, so CI and the
        # published image build the site identically.
        run: pip install mkdocs-material pymdown-extensions
      - name: mkdocs build --strict
        # --strict turns warnings into failures, and mkdocs.yml raises broken
        # anchors and unresolvable links to warnings. Without this job nothing
        # ran it: three broken links were live in the published docs, including
        # two anchors that were near-misses for their real headings.
        run: mkdocs build --strict

  chart:
    name: Helm chart — lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/serops
      - name: helm template
        # Proves the chart renders. secretKey is required by the chart, so a
        # throwaway value is supplied rather than making the template optional.
        run: >
          helm template serops deploy/helm/serops
          --kube-version 1.31.0
          --set django.secretKey=ci-render-only
