name: CI

# Runs on GitHub (github.com/getserops/serops), the public repository where
# contributions arrive. The maintainers' GitLab mirror runs the same checks
# from .gitlab-ci.yml; the two are deliberate duplicates, so a change to one
# belongs in the other.
#

# Monorepo CI. The per-repo workflows this replaces lived in the backend and
# frontend polyrepos, which are being retired — without this, pushing the
# monorepo to GitHub would ship a repository that tests nothing.
#
# Paths are scoped so a frontend-only change does not spend 10 minutes booting
# Postgres, and vice versa.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The test jobs need nothing but the checkout. Without this they inherited
# the repository default for the token.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint & tests (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # community: backend/ee/ is deleted first, so nothing outside ee/ can
        # come to depend on the Enterprise code (see backend/ee/README.md).
        edition: [full, community]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_serops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: api.test_settings
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: 'True'
      TEST_DB_HOST: localhost
      TEST_DB_PORT: '5432'
      TEST_DB_NAME: test_serops
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: testpass
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      # Registration and team-invite flows build activation links from these,
      # and the tests assert the link was sent. Locally they come from a .env
      # that is gitignored, so without them four tests fail on a clean checkout
      # for reasons that look nothing like the cause.
      API_URL: http://localhost:8000
      REACT_URL: http://localhost:3000
      SERVER_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Remove the Enterprise code (Community edition)
        if: matrix.edition == 'community'
        run: rm -rf ee
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install python dependencies
        run: pip install -r requirements.txt ruff==0.17.0  # pinned; rules in backend/ruff.toml
      - name: ruff check
        run: ruff check .
      - name: Migration check
        run: python manage.py makemigrations --check --dry-run
      - name: Run the whole test suite
        # The polyrepo workflow named seven modules explicitly, which quietly
        # excluded most of the suite — including, for a long time, 402 tests
        # that an empty tests.py stub was shadowing. A named list goes stale the
        # moment someone adds an app. Run everything.
        run: python manage.py test --verbosity=1 --noinput

  frontend:
    name: Frontend — lint, test, build (${{ matrix.edition }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # community: src/ee/ is deleted first (see backend job).
        edition: [full, community]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Remove the Enterprise code (Community edition)
        if: matrix.edition == 'community'
        run: rm -rf src/ee
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        # Fails on a HIGH or CRITICAL advisory in what ships in the image;
        # dev tooling is reported by Dependabot instead.
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Accessibility (axe, light + dark), phone layout and table alignment on
  # every main page, against the quick-start stack built from this commit
  # and the seeded demo org. Screenshots of every page are in the report.
  ui-quality:
    name: UI quality — axe, phone, alignment
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 40
    env:
      SEROPS_BACKEND_IMAGE: serops-ci/backend
      SEROPS_FRONTEND_IMAGE: serops-ci/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build images from this commit
        run: |
          docker build -t "$SEROPS_BACKEND_IMAGE" backend
          docker build -t "$SEROPS_FRONTEND_IMAGE" --build-arg VITE_BASE_URL=/api frontend
      - name: Start the quick-start stack and seed the demo org
        working-directory: deploy/quick-start
        run: |
          cp .env.example .env
          echo "SEROPS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(openssl rand -hex 32)|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|; s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$(openssl rand -hex 16)|" .env
          docker compose up -d --no-build --wait
          docker compose exec -T backend python manage.py seed_demo_org
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the UI quality suite
        working-directory: frontend
        env:
          UI_BASE_URL: https://localhost
        run: npx playwright test -c playwright.ui-quality.config.ts
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-quality-report
          path: frontend/playwright-report-ui
          retention-days: 14
      - name: Stack logs on failure
        if: failure()
        working-directory: deploy/quick-start
        run: docker compose logs --tail=200 backend frontend caddy

  docs:
    name: Docs — strict build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install MkDocs
        # Same two packages the docs Dockerfile installs, so CI and the
        # published image build the site identically.
        run: pip install mkdocs-material pymdown-extensions
      - name: mkdocs build --strict
        # --strict turns warnings into failures, and mkdocs.yml raises broken
        # anchors and unresolvable links to warnings. Without this job nothing
        # ran it: three broken links were live in the published docs, including
        # two anchors that were near-misses for their real headings.
        run: mkdocs build --strict

  chart:
    name: Helm chart — lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: helm lint
        run: helm lint deploy/helm/serops
      - name: helm template
        # Proves the chart renders. secretKey is required by the chart, so a
        # throwaway value is supplied rather than making the template optional.
        # TLS is required too: the chart refuses a plain-HTTP ingress.
        run: >
          helm template serops deploy/helm/serops
          --kube-version 1.31.0
          --set django.secretKey=ci-render-only
          --set django.encryptionKey=ci-render-only
          --set 'ingress.tls[0].hosts[0]=serops.example.com'
          --set ingress.tls[0].secretName=serops-tls
          --set devServices.postgresql.enabled=true
          --set devServices.redis.enabled=true
      - name: helm template refuses a plain-HTTP ingress
        run: >
          ! helm template serops deploy/helm/serops
          --kube-version 1.31.0
          --set django.secretKey=ci-render-only
          --set django.encryptionKey=ci-render-only
