name: helm-release

# Publish the SerOps Helm chart to GitHub Container Registry (OCI) on
# every release tag, plus a classic HTTP repo backed by GitHub Pages.
#
# Users install via either:
#
#     helm install serops oci://ghcr.io/getserops/charts/serops \
#         --version 1.3.0
#
# or the classic path:
#
#     helm repo add getserops https://getserops.github.io/serops
#     helm install serops getserops/serops
#
# NOT running today. SerOps is developed on GitLab, which does not execute
# GitHub Actions, so this is dormant until the repo is published to GitHub.
# There is no GitLab equivalent: chart publishing to GHCR only makes sense from
# GitHub, so .gitlab-ci.yml lints and templates the chart instead of releasing
# it.
#
# CHART_DIR below already matches this repo's layout (deploy/helm/serops).
# Skips PRs — no publish on unmerged code. The pushed chart is signed with
# cosign (keyless); SECURITY.md documents how to verify.

on:
  push:
    tags:
      - 'v*.*.*'
    # Also lint on chart-only PRs so we catch template breaks early.
  pull_request:
    paths:
      - 'deploy/helm/serops/**'

# Least privilege at the workflow level; the release job adds what it needs.
# `packages: write` used to apply to the whole workflow, PR lint job included.
permissions:
  contents: read

env:
  CHART_DIR: deploy/helm/serops
  REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  lint:
    # Fast fail on any PR touching the chart. Doesn't need registry
    # access.
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.19.0
      - name: helm dependency update
        run: helm dependency update ${{ env.CHART_DIR }}
      - name: helm lint
        run: helm lint ${{ env.CHART_DIR }}
      - name: helm template (default values)
        run: |
          helm template test ${{ env.CHART_DIR }} \
            --set django.secretKey=fake-for-template \
            --set django.encryptionKey=fake-for-template \
            --set 'ingress.tls[0].hosts[0]=serops.example.com' \
            --set ingress.tls[0].secretName=serops-tls \
            --set database.url=postgres://x/y \
            --set broker.url=redis://x \
            > /tmp/rendered.yaml
          wc -l /tmp/rendered.yaml

  release:
    # Only on tag push. Publishes to OCI and optionally to a
    # gh-pages branch for the classic Helm HTTP repo.
    name: package + push
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      # chart-releaser writes the gh-pages branch.
      contents: write
      packages: write
      # Keyless cosign signature on the pushed chart.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.19.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username ${{ github.actor }} \
              --password-stdin

      - name: helm dependency update
        run: helm dependency update ${{ env.CHART_DIR }}

      - name: Extract chart version from git tag
        # Strip the leading 'v' from the tag so chart version matches SemVer.
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "CHART_VERSION=${TAG}" >> "$GITHUB_ENV"

      - name: Package chart
        run: |
          helm package ${{ env.CHART_DIR }} \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}" \
            --destination .

      - name: Push chart to OCI and sign it
        # Publishes to oci://ghcr.io/<owner>/charts/serops:<version>, then
        # signs the digest helm push reports.
        run: |
          helm push "serops-${CHART_VERSION}.tgz" "oci://${{ env.REGISTRY }}" 2>&1 | tee push.log
          DIGEST=$(sed -n 's/^Digest: //p' push.log)
          test -n "$DIGEST"
          cosign sign --yes "${{ env.REGISTRY }}/serops@${DIGEST}"

      # Optional classic HTTP repo — comment out if you only want OCI.
      - name: Update gh-pages Helm repo
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957  # v1.9.0
        with:
          charts_dir: deploy/helm
          # Uses GITHUB_TOKEN default; publishes index.yaml + tarballs
          # to the gh-pages branch, which GitHub Pages serves at
          # https://<owner>.github.io/<repo>/
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
