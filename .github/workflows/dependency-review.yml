name: Dependency Review

# Runs on GitHub (github.com/getserops/serops), the public repository where
# contributions arrive. The maintainers' GitLab mirror runs the same checks
# from .gitlab-ci.yml; the two are deliberate duplicates, so a change to one
# belongs in the other.
#

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
