name: Dependency Review

# Runs on GitHub (github.com/getserops/serops), the public repository where
# contributions arrive. The maintainers' GitLab mirror runs the same checks
# from .gitlab-ci.yml; the two are deliberate duplicates, so a change to one
# belongs in the other.
#

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
