name: CLA

# Contributor License Agreement check on pull requests (CLA.md). The bot
# comments on a contributor's first pull request; they accept by replying with
# the sentence below, once. Signatures are stored in the private repository
# getserops/cla-signatures, not here: the public repository is mirrored from
# GitLab with an exact-tree check, which would delete anything the bot wrote
# here. No outside service.
#
# Writing to another repository needs a token: the repository secret
# CLA_SIGNATURES_TOKEN, a fine-grained personal access token limited to
# getserops/cla-signatures with Contents read and write. GITHUB_TOKEN still
# comments on the pull request and sets the status.
#
# Switched off until the CLA has been reviewed by a lawyer: set the repository
# variable CLA_ENABLED to "true" (Settings -> Secrets and variables -> Actions
# -> Variables) to turn it on, and make "CLA" a required check on main.
#
# pull_request_target runs in the context of the base repository so the bot
# can comment on forks' pull requests; it never checks out the pull request's
# code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    if: vars.CLA_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          remote-organization-name: getserops
          remote-repository-name: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/getserops/serops/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot],github-actions[bot]
