name: Trivy image scan

# NOT the pipeline that runs today. SerOps is developed on GitLab, which does
# not read .github/workflows — see .gitlab-ci.yml for the live equivalent. This
# file is kept ready for a GitHub publish; the two are deliberate duplicates of
# the same checks, so a change to one belongs in the other.
#

# Scans the images the Docker workflow actually pushed.
#
# The polyrepo version scanned 'docker.io/serops/backend:latest' while its
# Docker workflow pushed to ghcr.io/<owner>/backend — so the security scan was
# aimed at a registry path the pipeline does not publish. A scan of the wrong
# image is worse than no scan: the Security tab looks tended.

on:
  workflow_run:
    workflows: [Docker]
    types: [completed]
    branches: [main]

jobs:
  scan:
    name: Scan ${{ matrix.component }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report to the Security tab even when findings exist
      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.component }}.sarif'
          # Distinct category per image, or the second upload overwrites the
          # first and only one component's findings survive.
          category: trivy-${{ matrix.component }}
