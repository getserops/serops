name: Docker

# Runs on GitHub (github.com/getserops/serops), the public repository where
# contributions arrive. The maintainers' GitLab mirror runs the same checks
# from .gitlab-ci.yml; the two are deliberate duplicates, so a change to one
# belongs in the other.
#

# Builds both images from the monorepo. Replaces the two per-repo workflows
# that lived in backend/.github and frontend/.github — which, inside this
# repo, GitHub never ran: Actions only reads .github/workflows at the
# repository ROOT. They sat there looking live while publishing nothing.
#
# Tags: a release tag v1.2.15 publishes 1.2.15, 1.2, the short sha and
# `latest`; a push to main publishes `main`, the short sha and `edge`.
# `latest` used to follow main, so every merged PR reached anyone running
# :latest before it had a release; it now moves only with a tag.
#
# Supply chain: the image is scanned before it is pushed (a CRITICAL or HIGH
# finding with a fix available blocks the publish), pushed with an SBOM and
# SLSA provenance attestations, signed with cosign (keyless, bound to this
# workflow's GitHub identity), and attested through GitHub's artifact
# attestations. SECURITY.md documents how to verify.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for GHCR push with the built-in GITHUB_TOKEN.
      packages: write
      # Trivy results go to the repository's Security tab.
      security-events: write
      # Keyless cosign signatures and GitHub artifact attestations.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Computed once in its own step so the value is stable across the
      # matrix and greppable in logs. RFC 3339 UTC is the OCI shape.
      - name: Compute build timestamp
        id: buildtime
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          # Owner comes from the repo path, so a fork or renamed org keeps
          # working without editing this file.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      # Security scan BEFORE anything is pushed. The amd64 variant is built
      # into the runner's Docker daemon (and the build cache, which the
      # multi-arch push below reuses), so the scan never pulls from ghcr.io.
      # It used to run after the push with exit-code 0, so a CRITICAL finding
      # was reported to the Security tab while the image was already public.
      - name: Build amd64 for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          provenance: false
          tags: serops-scan/${{ matrix.component }}:${{ github.sha }}
          build-args: |
            SEROPS_VERSION=${{ steps.meta.outputs.version }}
            SEROPS_GIT_SHA=${{ github.sha }}
            SEROPS_BUILT_AT=${{ steps.buildtime.outputs.iso }}
            VITE_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: serops-scan/${{ matrix.component }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: 'trivy-${{ matrix.component }}.sarif'
          # Distinct category per image, or the second upload overwrites the
          # first and only one component's findings survive.
          category: trivy-${{ matrix.component }}
      - name: Trivy scan (gate)
        # Fails the publish on CRITICAL/HIGH findings that have a fix. Unfixed
        # distribution findings (no upstream patch yet) are reported above but
        # cannot block: there is nothing to do about them in this repo.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: serops-scan/${{ matrix.component }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
        env:
          # The report step already downloaded the database.
          TRIVY_SKIP_DB_UPDATE: 'true'

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM (SPDX) and SLSA provenance attached to the image index.
          sbom: true
          provenance: mode=max
          # Backend reads the version ARGs so /api/version/ reports real
          # values instead of its 1.0.0-dev fallback. VITE_BASE_URL must be
          # the RELATIVE /api — Vite inlines it at build time, so a published
          # image cannot be repointed later; /api works for every deployment
          # whose ingress routes /api to the backend. A different host needs
          # its own build.
          build-args: |
            SEROPS_VERSION=${{ steps.meta.outputs.version }}
            SEROPS_GIT_SHA=${{ github.sha }}
            SEROPS_BUILT_AT=${{ steps.buildtime.outputs.iso }}
            VITE_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signature on the pushed digest: the certificate names this
      # repository and workflow, the Sigstore transparency log records it.
      # One signature covers every tag of the digest.
      - name: Sign the image with cosign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
