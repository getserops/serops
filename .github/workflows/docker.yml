name: Docker

# NOT the pipeline that runs today. SerOps is developed on GitLab, which does
# not read .github/workflows — see .gitlab-ci.yml for the live equivalent. This
# file is kept ready for a GitHub publish; the two are deliberate duplicates of
# the same checks, so a change to one belongs in the other.
#

# Builds both images from the monorepo. Replaces the two per-repo workflows
# that lived in backend/.github and frontend/.github — which, inside this
# repo, GitHub never ran: Actions only reads .github/workflows at the
# repository ROOT. They sat there looking live while publishing nothing.
#
# `latest` follows `main` here. The polyrepo workflows pointed it at
# `develop`, which does not exist in this repo, so carrying that over
# verbatim would have produced images with no `latest` tag at all.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for GHCR push with the built-in GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Computed once in its own step so the value is stable across the
      # matrix and greppable in logs. RFC 3339 UTC is the OCI shape.
      - name: Compute build timestamp
        id: buildtime
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Owner comes from the repo path, so a fork or renamed org keeps
          # working without editing this file.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Backend reads the version ARGs so /api/version/ reports real
          # values instead of its 1.0.0-dev fallback. VITE_BASE_URL must be
          # the RELATIVE /api — Vite inlines it at build time, so a published
          # image cannot be repointed later; /api works for every deployment
          # whose ingress routes /api to the backend. A different host needs
          # its own build.
          build-args: |
            SEROPS_VERSION=${{ steps.meta.outputs.version }}
            SEROPS_GIT_SHA=${{ github.sha }}
            SEROPS_BUILT_AT=${{ steps.buildtime.outputs.iso }}
            VITE_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
