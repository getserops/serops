name: Docker

# Runs on GitHub (github.com/getserops/serops), the public repository where
# contributions arrive. The maintainers' GitLab mirror runs the same checks
# from .gitlab-ci.yml; the two are deliberate duplicates, so a change to one
# belongs in the other.
#

# Builds both images from the monorepo. Replaces the two per-repo workflows
# that lived in backend/.github and frontend/.github — which, inside this
# repo, GitHub never ran: Actions only reads .github/workflows at the
# repository ROOT. They sat there looking live while publishing nothing.
#
# `latest` follows `main` here. The polyrepo workflows pointed it at
# `develop`, which does not exist in this repo, so carrying that over
# verbatim would have produced images with no `latest` tag at all.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for GHCR push with the built-in GITHUB_TOKEN.
      packages: write
      # Trivy results go to the repository's Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Computed once in its own step so the value is stable across the
      # matrix and greppable in logs. RFC 3339 UTC is the OCI shape.
      - name: Compute build timestamp
        id: buildtime
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Owner comes from the repo path, so a fork or renamed org keeps
          # working without editing this file.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Backend reads the version ARGs so /api/version/ reports real
          # values instead of its 1.0.0-dev fallback. VITE_BASE_URL must be
          # the RELATIVE /api — Vite inlines it at build time, so a published
          # image cannot be repointed later; /api works for every deployment
          # whose ingress routes /api to the backend. A different host needs
          # its own build.
          build-args: |
            SEROPS_VERSION=${{ steps.meta.outputs.version }}
            SEROPS_GIT_SHA=${{ github.sha }}
            SEROPS_BUILT_AT=${{ steps.buildtime.outputs.iso }}
            VITE_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security scan of the image this job just built. The amd64 variant is
      # loaded into the runner's Docker daemon from the build cache, so the
      # scan never pulls from ghcr.io. It used to run as a separate workflow
      # that pulled :latest from GHCR, and every one of those pulls counted
      # as a package download — most of the public download count was CI.
      - name: Load image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: serops-scan/${{ matrix.component }}:${{ github.sha }}
          build-args: |
            SEROPS_VERSION=${{ steps.meta.outputs.version }}
            SEROPS_GIT_SHA=${{ github.sha }}
            SEROPS_BUILT_AT=${{ steps.buildtime.outputs.iso }}
            VITE_BASE_URL=/api
          cache-from: type=gha
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: serops-scan/${{ matrix.component }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report to the Security tab even when findings exist
      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.component }}.sarif'
          # Distinct category per image, or the second upload overwrites the
          # first and only one component's findings survive.
          category: trivy-${{ matrix.component }}
