name: CodeQL

# NOT the pipeline that runs today. SerOps is developed on GitLab, which does
# not read .github/workflows — see .gitlab-ci.yml for the live equivalent. This
# file is kept ready for a GitHub publish; the two are deliberate duplicates of
# the same checks, so a change to one belongs in the other.
#

# One workflow covering both languages. The polyrepos each scanned their own
# (python / javascript-typescript); in this repo both live side by side, so a
# single matrix covers the whole tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
