# Weekly dependency updates, grouped so a week's bumps arrive as a few PRs
# rather than dozens (major updates in their own group per ecosystem, so
# they stay apart from the routine ones and can be split when one breaks). Security updates are opened as soon as an advisory
# is published regardless of the schedule. The frontend sat on a two-year-old
# pinned framework version before this existed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly, day: monday}
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]

  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly, day: monday}
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
      backend-major:
        update-types: [major]
    ignore:
      # numpy 2.5 needs Python >= 3.12 and the image (backend/Dockerfile) is
      # on 3.11. Drop this when the image moves to 3.12.
      - dependency-name: numpy
        versions: [">=2.5"]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /docs]
    schedule: {interval: weekly, day: monday}

  - package-ecosystem: docker-compose
    directory: /deploy/quick-start
    schedule: {interval: weekly, day: monday}
    ignore:
      # A new Postgres major cannot open the previous major's data directory,
      # so bumping it would stop existing quick-start databases from starting
      # (GitHub #19, 16 -> 18). Major upgrades need a documented dump and
      # restore; minor and patch updates still come through.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
